name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new advisory is noticed even when nothing is pushed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - run: npm ci

      - name: Lint (strict type check)
        run: npm run lint

      - name: Build and test
        run: npm test

  # Check pull requests too, so vulnerable dependency changes cannot bypass this gate.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit locked desktop runtime
        working-directory: desktop/runtime
        run: npm audit --omit=dev --audit-level=high
      - name: Audit desktop packaging toolchain
        working-directory: desktop
        run: npm audit --audit-level=high
