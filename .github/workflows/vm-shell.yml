name: vm-shell

# Runs one PowerShell command on the self-hosted Windows ARM computer (the desktop-e2e runner) and shows its output in
# the log and the run summary. Only people with write access can start it, from Actions > vm-shell > Run workflow (or
# the API). The command reaches the script through an environment variable, never pasted into the script text.
on:
  workflow_dispatch:
    inputs:
      command:
        description: PowerShell command to run on the Windows ARM computer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vm-shell
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, windows, arm64]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Run command
        env:
          VM_COMMAND: ${{ inputs.command }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'vm-shell.txt'
          Write-Host "> $env:VM_COMMAND"
          $code = 0
          try {
            Invoke-Expression $env:VM_COMMAND 2>&1 | Out-String -Width 200 | Tee-Object -FilePath $out
            if ($LASTEXITCODE) { $code = $LASTEXITCODE }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $out -Append
            $code = 1
          }
          $text = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
          if ($text.Length -gt 60000) { $text = $text.Substring($text.Length - 60000) }
          $summary = "### ``$env:VM_COMMAND```n`nExit code: $code`n`n``````text`n$text`n```````n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary)
          exit $code
