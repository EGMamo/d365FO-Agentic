# Open WebUI as a chat front end for the D365FO test runner.
#
#   1. Start the settings app on this computer:  npm run ui
#      (Linux only: npm run ui -- --host 0.0.0.0, so the container can reach it)
#   2. Start Open WebUI:                         npm run openwebui:up
#   3. Open http://localhost:3000, create the admin account, then add the tool server
#      (Admin Panel > Settings > External Tools) with the address and key that
#      `npm run openwebui` prints. Full steps: docs/openwebui.md
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: d365fo-open-webui
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    extra_hosts:
      # Lets the container reach the settings app on this computer as host.docker.internal (needed on Linux).
      - "host.docker.internal:host-gateway"
    environment:
      # Optional: point Open WebUI at an OpenAI-compatible model endpoint for the chat itself.
      # The test runs still use the LLM set in the active D365FO profile.
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui:
