<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D365FO Agent</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1b1f27; --muted:#667085; --line:#d9dde4; --accent:#2563eb; --accent-text:#fff; --danger:#b42318; --ok:#067647; --warn:#9a6700; --warn-bg:#fff4e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --text:#e7eaf0; --muted:#98a2b3; --line:#2f3644; --accent:#5b8def; --accent-text:#0b1220; --danger:#f97066; --ok:#47cd89; --warn:#d29922; --warn-bg:#3a2a12; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:.75rem; padding:.8rem 1.25rem; background:var(--panel); border-bottom:1px solid var(--line); }
  header img { width:30px; height:30px; }
  header h1 { font-size:1.05rem; margin:0; }
  header .sub { color:var(--muted); font-size:.85rem; margin-left:auto; }
  nav.tabs { display:flex; gap:2px; margin-left:1rem; }
  nav.tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:.5rem .8rem; color:var(--muted); font:inherit; cursor:pointer; }
  nav.tabs button.active { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  main { padding:1.25rem; max-width:1200px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; }
  .layout { display:grid; grid-template-columns:280px 1fr; gap:1.25rem; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem; margin-bottom:1rem; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 .6rem; }
  h3 { font-size:1.15rem; margin:0; }
  .profile { display:flex; align-items:center; gap:.5rem; width:100%; text-align:left; padding:.55rem .7rem; border:1px solid transparent; border-radius:8px; background:none; color:inherit; font:inherit; cursor:pointer; }
  .profile:hover { background:var(--bg); }
  .profile[aria-current="true"] { border-color:var(--accent); background:var(--bg); }
  .badge { margin-left:auto; font-size:.72rem; padding:.1rem .45rem; border-radius:99px; background:var(--accent); color:var(--accent-text); }
  button.btn { font:inherit; padding:.5rem .9rem; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  button.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; align-items:center; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  fieldset { border:0; padding:0; margin:0 0 1.25rem; }
  legend { font-weight:600; margin-bottom:.5rem; padding:0; }
  .field { display:grid; grid-template-columns:220px 1fr; gap:.25rem .75rem; align-items:center; margin-bottom:.55rem; }
  @media (max-width:760px) { .field { grid-template-columns:1fr; } }
  .field label { font-size:.9rem; }
  .field .help { grid-column:2; color:var(--muted); font-size:.8rem; margin-top:-.15rem; }
  @media (max-width:760px) { .field .help { grid-column:1; } }
  input[type=text], input[type=password], input[type=number], select { width:100%; font:inherit; padding:.45rem .6rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .custom { display:grid; grid-template-columns:1fr 1.5fr auto; gap:.5rem; margin-bottom:.5rem; }
  .empty { color:var(--muted); padding:2rem 1rem; text-align:center; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.75rem; overflow:auto; max-height:480px; white-space:pre-wrap; word-break:break-word; font:12px/1.4 ui-monospace, Menlo, monospace; margin:0; }
  .note { background:var(--warn-bg); border-radius:8px; padding:.6rem .8rem; font-size:.85rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  .passed { color:var(--ok); } .failed, .blocked { color:var(--danger); } .skipped { color:var(--muted); }
  #runStatus { font-size:.9rem; }
  #runStatus.running { color:var(--accent); }
  #runStatus.passed { color:var(--ok); }
  #runStatus.failed, #runStatus.stopped { color:var(--danger); }
  #toast { position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:.6rem 1rem; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  #toast.show { opacity:1; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--text); padding:1.25rem; width:min(420px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog label { display:block; margin:.6rem 0 .25rem; font-size:.9rem; }
  dialog .row { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }
  textarea { width:100%; font:inherit; padding:.45rem .6rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); resize:vertical; min-height:2.4rem; }
  .steps .step { display:grid; grid-template-columns:2rem 1fr 1fr auto; gap:.5rem; align-items:start; margin-bottom:.5rem; }
  @media (max-width:760px) { .steps .step { grid-template-columns:2rem 1fr; } }
  .steps .num { color:var(--muted); padding-top:.5rem; text-align:right; }
  .case { display:block; width:100%; text-align:left; font:inherit; background:none; border:1px solid transparent; border-radius:8px; padding:.45rem .6rem; color:var(--text); cursor:pointer; }
  .case:hover { background:var(--bg); }
  .case[aria-current="true"] { border-color:var(--accent); background:var(--bg); }
  .case small { display:block; color:var(--muted); }
  .chips span { display:inline-block; font-size:.75rem; padding:.05rem .45rem; border-radius:99px; border:1px solid var(--line); margin-right:.25rem; }
  .totals span { margin-right:.6rem; }
  a.btn { text-decoration:none; display:inline-block; }
  .err { color:var(--danger); font-size:.85rem; min-height:1.2em; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <img src="/icon.svg" alt="">
  <h1>D365FO Agent</h1>
  <nav class="tabs">
    <button class="tab active" data-tab="profiles" type="button">Profiles</button>
    <button class="tab" data-tab="cases" type="button">Test cases</button>
    <button class="tab" data-tab="run" type="button">Run</button>
    <button class="tab" data-tab="results" type="button">Results</button>
    <button class="tab" data-tab="history" type="button">History</button>
  </nav>
  <span class="sub" id="homeInfo"></span>
</header>
<main>
  <section class="view active" id="tab-profiles">
    <div class="layout">
      <aside class="panel">
        <h2>Profiles</h2>
        <div id="list"></div>
        <div class="actions" style="margin:.75rem 0 0">
          <button class="btn primary" id="newBtn" type="button">+ New profile</button>
        </div>
        <p class="help" id="activeInfo" style="color:var(--muted);font-size:.82rem;margin:.9rem 0 .4rem"></p>
        <button class="btn" id="noneBtn" type="button" hidden>Use the .env file instead</button>
      </aside>
      <section class="panel" id="editor" aria-live="polite"></section>
    </div>
  </section>

  <section class="view" id="tab-cases">
    <div class="layout">
      <aside class="panel">
        <h2>Folder</h2>
        <div class="row" style="margin-bottom:.6rem"><input type="text" id="caseDir" value="examples/testcases" aria-label="Test-case folder"><button class="btn" id="caseDirLoad" type="button">Open</button></div>
        <div id="caseList"></div>
        <div class="actions" style="margin:.75rem 0 0"><button class="btn primary" id="caseNew" type="button">+ New test case</button></div>
      </aside>
      <section class="panel" id="caseEditor" aria-live="polite"></section>
    </div>
  </section>

  <section class="view" id="tab-run">
    <div class="panel">
      <h2>Test cases</h2>
      <div class="field">
        <label>Source</label>
        <div class="row">
          <label><input type="radio" name="source" value="local" checked> Local folder</label>
          <label><input type="radio" name="source" value="devops"> Azure DevOps</label>
        </div>
      </div>
      <div class="field"><label for="local">Folder</label><input id="local" value="examples/testcases"></div>
      <div class="field">
        <label>Plan / suite</label>
        <div class="row"><input id="plan" placeholder="plan id (default from profile)" style="width:220px"><input id="suite" placeholder="suite id" style="width:220px"></div>
      </div>
      <div class="field">
        <label for="caseId">Case</label>
        <div class="row"><select id="caseId" style="width:460px"><option value="">All cases</option></select><button class="btn" id="load" type="button">Load cases</button></div>
        <div class="help">"Load cases" works for local folders; for Azure DevOps the whole plan/suite runs (you can still type a case id in the box).</div>
      </div>
      <div class="field">
        <label>Options</label>
        <div class="row">
          <label><input type="checkbox" id="dryRun"> Dry run (no clicks/typing that change data)</label>
          <label><input type="checkbox" id="upload"> Upload results to Azure DevOps</label>
          <label>Retries <input id="retries" type="number" min="0" max="10" placeholder="default" style="width:90px"></label>
        </div>
      </div>
      <div class="actions" style="margin-top:12px;margin-bottom:0">
        <button class="btn primary" id="start" type="button">Run</button>
        <button class="btn danger" id="stop" type="button" disabled>Stop</button>
        <span id="runStatus"></span>
      </div>
    </div>
    <div class="panel"><h2>Live log</h2><pre id="log">No run yet.</pre></div>
  </section>

  <section class="view" id="tab-results">
    <div class="panel">
      <div class="actions" style="margin-bottom:.6rem">
        <h3 id="resultsTitle">Latest run</h3>
        <button class="btn" id="refreshResults" type="button">Refresh</button>
        <a class="btn" id="reportLink" href="/report" target="_blank" rel="noopener">Open full HTML report ↗</a>
        <a class="btn" id="jsonLink" href="/download/results.json">JSON</a>
        <a class="btn" id="junitLink" href="/download/results.junit.xml">JUnit XML</a>
      </div>
      <div id="results"></div>
    </div>
  </section>

  <section class="view" id="tab-history">
    <div class="panel">
      <div class="actions" style="margin-bottom:.6rem">
        <h3>Run history</h3>
        <button class="btn" id="refreshHistory" type="button">Refresh</button>
        <label>Plan for upload <input type="text" id="uploadPlan" placeholder="default from profile" style="width:180px"></label>
      </div>
      <div id="history"></div>
    </div>
  </section>
</main>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h2 style="margin:0">New profile</h2>
    <label for="newName">Name</label>
    <input type="text" id="newName" maxlength="60" placeholder="e.g. Sandbox UAT" required autocomplete="off">
    <label for="newFrom">Start from</label>
    <select id="newFrom"></select>
    <div class="err" id="newErr" role="alert"></div>
    <div class="row">
      <button class="btn" type="button" id="newCancel">Cancel</button>
      <button class="btn primary" type="submit">Create</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
'use strict';
const MASK = '••••••••';
const SECRET = /PASSWORD|PASSWD|SECRET|TOKEN|API_KEY|_KEY$|_PAT$/i;
let state = { profiles: [], active: null, catalog: [], home: '' };
let current = null; // { name, entries: [{key,value}] }

const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
async function api(path, method = 'GET', body) {
  const res = await fetch(path, { method, headers: { 'content-type': 'application/json', 'x-requested-with': 'd365fo-ui' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
  return data;
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
const fail = (e) => toast(e.message || String(e));

async function refresh(select) {
  state = await api('/api/state');
  $('homeInfo').textContent = 'Saved in ' + state.home;
  $('activeInfo').textContent = state.active
    ? 'Runs use "' + state.active + '".'
    : 'No profile selected: runs use the .env file in the project folder.';
  $('noneBtn').hidden = !state.active;
  renderList();
  if (select === null) { current = null; return renderEditor(); }
  const name = select || (current && state.profiles.some((p) => p.name === current.name) ? current.name : (state.active || (state.profiles[0] && state.profiles[0].name)));
  if (name) await open(name); else { current = null; renderEditor(); }
}
function renderList() {
  const list = $('list'); list.replaceChildren();
  if (!state.profiles.length) list.append(el('p', { class: 'empty' }, 'No profiles yet. Create one to get started.'));
  for (const p of state.profiles) {
    list.append(el('button', { class: 'profile', type: 'button', 'aria-current': current && current.name === p.name ? 'true' : 'false', onclick: () => open(p.name).catch(fail) },
      p.name, p.active ? el('span', { class: 'badge' }, 'In use') : null));
  }
}
async function open(name) {
  const data = await api('/api/profiles/' + encodeURIComponent(name));
  current = { name, entries: data.entries };
  renderList(); renderEditor();
}
function fieldInput(spec, value) {
  const id = 'f_' + spec.key;
  let input;
  if (spec.options) {
    input = el('select', { id, 'data-key': spec.key }, spec.options.map((o) => el('option', { value: o }, o === '' ? '(default)' : o)));
    if (value && !spec.options.includes(value)) input.append(el('option', { value }, value));
    input.value = value || '';
  } else {
    input = el('input', { id, 'data-key': spec.key, type: spec.secret ? 'password' : 'text', autocomplete: 'off', spellcheck: 'false', placeholder: spec.placeholder || '' });
    input.value = value || '';
    if (spec.secret && value === MASK) input.addEventListener('focus', () => input.select());
  }
  return el('div', { class: 'field' }, el('label', { for: id }, spec.label), input,
    (spec.help || (spec.secret && value === MASK)) ? el('div', { class: 'help' }, [spec.help, spec.secret && value === MASK ? 'A value is saved. Type to replace it, or clear the box to remove it.' : ''].filter(Boolean).join(' ')) : null);
}
function customRow(key, value) {
  const k = el('input', { type: 'text', placeholder: 'VARIABLE_NAME', 'aria-label': 'Variable name', 'data-ck': '1', spellcheck: 'false' }); k.value = key;
  const v = el('input', { type: SECRET.test(key) ? 'password' : 'text', placeholder: 'value', 'aria-label': 'Value', 'data-cv': '1', autocomplete: 'off', spellcheck: 'false' }); v.value = value;
  k.addEventListener('input', () => { v.type = SECRET.test(k.value) ? 'password' : 'text'; });
  const row = el('div', { class: 'custom' }, k, v, el('button', { class: 'btn danger', type: 'button', 'aria-label': 'Remove variable', onclick: () => row.remove() }, '×'));
  return row;
}
function renderEditor() {
  const ed = $('editor'); ed.replaceChildren();
  if (!current) { ed.append(el('p', { class: 'empty' }, 'Create a profile to set up an environment: its F&O address, sign-in, AI model and safety limits.')); return; }
  const known = new Set(state.catalog.map((f) => f.key));
  const values = new Map(current.entries.map((e) => [e.key, e.value]));
  const isActive = state.active === current.name;
  ed.append(el('div', { class: 'actions' },
    el('h3', {}, current.name),
    el('button', { class: 'btn', type: 'button', disabled: isActive, onclick: () => use(current.name).catch(fail) }, isActive ? 'In use' : 'Use this profile'),
    el('button', { class: 'btn', type: 'button', onclick: () => checkSetup().catch(fail) }, 'Check setup'),
    el('button', { class: 'btn', type: 'button', onclick: () => openNew(current.name) }, 'Duplicate'),
    el('button', { class: 'btn danger', type: 'button', onclick: () => remove().catch(fail) }, 'Delete')));
  if (!isActive) ed.append(el('div', { class: 'note' }, state.active ? 'Runs currently use "' + state.active + '". Choose "Use this profile" to switch to this one.' : 'Not in use yet. Choose "Use this profile" so runs read these settings instead of the .env file.'));
  const form = el('form', { id: 'form' });
  const groups = [...new Set(state.catalog.map((f) => f.group))];
  for (const g of groups) {
    const fs = el('fieldset', {}, el('legend', {}, g));
    for (const spec of state.catalog.filter((f) => f.group === g)) fs.append(fieldInput(spec, values.get(spec.key)));
    form.append(fs);
  }
  const customs = el('div', { id: 'customs' });
  for (const e of current.entries) if (!known.has(e.key)) customs.append(customRow(e.key, e.value));
  form.append(el('fieldset', {}, el('legend', {}, 'Other variables'), customs,
    el('button', { class: 'btn', type: 'button', onclick: () => customs.append(customRow('', '')) }, '+ Add variable')));
  form.append(el('div', { class: 'actions' }, el('button', { class: 'btn primary', type: 'submit' }, 'Save changes')));
  form.addEventListener('submit', (ev) => { ev.preventDefault(); save().catch(fail); });
  ed.append(form, el('div', { id: 'checkOut' }));
}
function collect() {
  const entries = [];
  for (const i of document.querySelectorAll('#form [data-key]')) if (i.value !== '') entries.push({ key: i.dataset.key, value: i.value });
  for (const row of document.querySelectorAll('#customs .custom')) {
    const key = row.querySelector('[data-ck]').value.trim(); const value = row.querySelector('[data-cv]').value;
    if (key) entries.push({ key, value });
  }
  return entries;
}
async function save() { await api('/api/profiles/' + encodeURIComponent(current.name), 'PUT', { entries: collect() }); toast('Saved'); await open(current.name); }
async function use(name) { await api('/api/active', 'POST', { name }); toast('"' + name + '" is now in use'); await refresh(name); }
async function remove() {
  if (!confirm('Delete the profile "' + current.name + '"? Its saved settings and secrets are removed from this computer.')) return;
  await api('/api/profiles/' + encodeURIComponent(current.name), 'DELETE'); toast('Deleted'); current = null; await refresh();
}
async function checkSetup() {
  await save();
  const out = $('checkOut'); out.replaceChildren(el('p', {}, 'Checking… this can take a few seconds.'));
  const r = await api('/api/profiles/' + encodeURIComponent(current.name) + '/check', 'POST');
  out.replaceChildren(el('h2', {}, r.exitCode === 0 ? 'Setup looks good' : 'Things to fix'), el('pre', {}, r.output || '(no output)'));
}
function openNew(from) {
  $('newName').value = ''; $('newErr').textContent = '';
  const sel = $('newFrom'); sel.replaceChildren(el('option', { value: '' }, 'Blank profile'));
  for (const p of state.profiles) sel.append(el('option', { value: p.name }, 'Copy of ' + p.name));
  sel.value = from || '';
  $('newDlg').showModal(); $('newName').focus();
}
$('newBtn').addEventListener('click', () => openNew());
$('noneBtn').addEventListener('click', () => api('/api/active', 'POST', {}).then(() => { toast('Runs now use the .env file'); return refresh(); }).catch(fail));
$('newCancel').addEventListener('click', () => $('newDlg').close());
$('newForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const name = $('newName').value.trim(), copyFrom = $('newFrom').value;
  try { await api('/api/profiles', 'POST', copyFrom ? { name, copyFrom } : { name, entries: [] }); $('newDlg').close(); toast('Created'); await refresh(name); }
  catch (e) { $('newErr').textContent = e.message; }
});

// ── Tabs ──
document.querySelectorAll('nav.tabs button').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.tab === 'results') viewRun = null;
  showTab(b.dataset.tab);
}));
function showTab(tab) {
  document.querySelectorAll('nav.tabs button').forEach((x) => x.classList.toggle('active', x.dataset.tab === tab));
  document.querySelectorAll('.view').forEach((s) => s.classList.toggle('active', s.id === 'tab-' + tab));
  if (tab === 'results') loadResults().catch(fail);
  if (tab === 'history') loadHistory().catch(fail);
  if (tab === 'cases' && !casesLoaded) loadCases().catch(fail);
}

// ── Run ──
const source = () => document.querySelector('input[name=source]:checked').value;
$('load').addEventListener('click', async () => {
  const sel = $('caseId');
  if (source() !== 'local') { sel.replaceChildren(el('option', { value: '' }, 'Type a case id, or leave empty for all')); return; }
  sel.replaceChildren(el('option', { value: '' }, 'Loading…'));
  try {
    const cases = await api('/api/cases?local=' + encodeURIComponent($('local').value));
    sel.replaceChildren(el('option', { value: '' }, 'All cases (' + cases.length + ')'));
    for (const c of cases) sel.append(el('option', { value: c.id }, '[' + c.id + '] ' + c.title + ' — ' + c.steps + ' step(s)'));
  } catch (e) { sel.replaceChildren(el('option', { value: '' }, 'Error: ' + (e.message || e))); }
});
$('start').addEventListener('click', async () => {
  const body = { source: source(), local: $('local').value, plan: $('plan').value, suite: $('suite').value, caseId: $('caseId').value, dryRun: $('dryRun').checked, upload: $('upload').checked, retries: $('retries').value };
  try {
    $('log').textContent = '';
    const res = await api('/api/run', 'POST', body);
    if (res.error) { $('log').textContent = res.error; return; }
    showStatus(res.run);
  } catch (e) { $('log').textContent = String(e.message || e); }
});
$('stop').addEventListener('click', () => api('/api/run/stop', 'POST', {}).catch(() => {}));
function showStatus(r) {
  const running = r && r.status === 'running';
  $('start').disabled = running; $('stop').disabled = !running;
  const s = $('runStatus'); s.className = r ? r.status : '';
  s.textContent = !r ? '' : running ? 'Running…' : r.status === 'passed' ? 'Finished' : r.status === 'stopped' ? 'Stopped' : 'Finished with failures (exit ' + r.exitCode + ')';
  if (r && !running) { viewRun = null; loadResults().catch(() => {}); loadHistory().catch(() => {}); }
}
function appendLog(line) {
  const log = $('log');
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.append(line + '\n');
  if (stick) log.scrollTop = log.scrollHeight;
}
async function initRun() {
  try {
    const r = await api('/api/run');
    if (r) { $('log').textContent = ''; r.lines.forEach(appendLog); showStatus(r); }
  } catch { /* no run yet */ }
  const es = new EventSource('/api/run/events');
  es.addEventListener('line', (e) => appendLog(JSON.parse(e.data).line));
  es.addEventListener('status', (e) => showStatus(JSON.parse(e.data)));
}

// ── Results ──
let viewRun = null;
async function loadResults() {
  const box = $('results');
  const q = viewRun ? '?run=' + encodeURIComponent(viewRun) : '';
  $('resultsTitle').textContent = viewRun ? 'Run ' + viewRun : 'Latest run';
  $('reportLink').href = '/report' + q; $('jsonLink').href = '/download/results.json' + q; $('junitLink').href = '/download/results.junit.xml' + q;
  let results;
  try { results = await api('/api/results' + q); } catch (e) { box.textContent = String(e.message || e); return; }
  if (!results || !results.length) { box.textContent = 'No results yet. Run some tests first.'; return; }
  const table = el('table', {}, el('tr', {}, ...['Case', 'Outcome', 'Attempts', 'Duration', 'Details'].map((h) => el('th', {}, h))));
  for (const r of results) {
    const details = el('div');
    if (r.errorMessage) details.append(el('div', {}, r.errorMessage));
    for (const s of r.steps || []) {
      details.append(el('div', {}, el('span', { class: s.status }, 'Step ' + s.index + ' ' + s.status + (s.verified ? ' ✓' : '') + ': '), (s.observed || s.errorMessage || '')));
    }
    for (const p of r.policyBlocks || []) details.append(el('div', { class: 'blocked' }, 'Guardrail: ' + p));
    table.append(el('tr', {},
      el('td', {}, '[' + r.testCaseId + '] ' + r.title),
      el('td', { class: r.outcome }, r.outcome),
      el('td', {}, String(r.attemptCount || 1)),
      el('td', {}, (r.durationMs / 1000).toFixed(1) + 's'),
      el('td', {}, details)));
  }
  box.replaceChildren(table);
}
$('refreshResults').addEventListener('click', () => loadResults().catch(fail));

// ── History ──
async function loadHistory() {
  const box = $('history');
  const runs = await api('/api/history');
  if (!runs.length) { box.replaceChildren(el('p', { class: 'empty' }, 'No runs yet. Every run started here is kept with its reports.')); return; }
  const table = el('table', {}, el('tr', {}, ...['Started', 'Profile', 'What ran', 'Outcome', 'Azure DevOps', ''].map((h) => el('th', {}, h))));
  for (const r of runs) {
    const t = r.totals;
    const outcome = t ? el('span', { class: 'totals' }, el('span', { class: 'passed' }, t.passed + ' passed'), t.failed ? el('span', { class: 'failed' }, t.failed + ' failed') : null, t.blocked ? el('span', { class: 'blocked' }, t.blocked + ' blocked') : null, t.skipped ? el('span', { class: 'skipped' }, t.skipped + ' skipped') : null)
      : el('span', { class: r.status }, r.status === 'stopped' ? 'stopped, no results' : 'no results');
    const q = '?run=' + encodeURIComponent(r.id);
    const devops = r.upload ? (r.upload.url ? el('a', { href: r.upload.url, target: '_blank', rel: 'noopener' }, 'Run #' + r.upload.runId + ' ↗') : 'Uploaded') : '';
    table.append(el('tr', {},
      el('td', {}, new Date(r.startedAt).toLocaleString()),
      el('td', {}, r.profile || '.env'),
      el('td', {}, el('code', {}, r.args.slice(1).join(' ') || 'all')),
      el('td', {}, outcome),
      el('td', {}, devops),
      el('td', {}, el('div', { class: 'row' },
        t ? el('button', { class: 'btn', type: 'button', onclick: () => { viewRun = r.id; showTab('results'); } }, 'View') : null,
        t ? el('a', { class: 'btn', href: '/report' + q, target: '_blank', rel: 'noopener' }, 'Report ↗') : null,
        t ? el('a', { class: 'btn', href: '/download/results.junit.xml' + q }, 'JUnit') : null,
        t ? el('button', { class: 'btn', type: 'button', onclick: () => uploadRun(r.id).catch(fail) }, r.upload ? 'Upload again' : 'Upload to DevOps') : null,
        el('button', { class: 'btn danger', type: 'button', 'aria-label': 'Delete run', onclick: () => deleteRun(r.id).catch(fail) }, '×')))));
  }
  box.replaceChildren(table);
}
async function uploadRun(id) {
  if (!confirm('Upload run ' + id + ' to Azure DevOps as a new test run, using the profile in use?')) return;
  const res = await api('/api/history/' + encodeURIComponent(id) + '/upload', 'POST', { plan: $('uploadPlan').value });
  if (res.error) return toast(res.error);
  $('log').textContent = ''; showStatus(res.run); showTab('run');
}
async function deleteRun(id) {
  if (!confirm('Delete run ' + id + ' and its reports from this computer?')) return;
  await api('/api/history/' + encodeURIComponent(id), 'DELETE'); toast('Deleted'); await loadHistory();
}
$('refreshHistory').addEventListener('click', () => loadHistory().catch(fail));

// ── Test cases ──
let casesLoaded = false, cases = [], editing = null; // editing: { file|null, tc }
const caseDir = () => $('caseDir').value.trim();
async function loadCases(select) {
  casesLoaded = true;
  cases = await api('/api/testcases?dir=' + encodeURIComponent(caseDir()));
  renderCaseList();
  if (select) await openCase(select);
  else if (!editing) renderCaseEditor();
}
function renderCaseList() {
  const list = $('caseList'); list.replaceChildren();
  if (!cases.length) list.append(el('p', { class: 'empty' }, 'No test cases in this folder yet.'));
  for (const c of cases) list.append(el('button', { class: 'case', type: 'button', 'aria-current': editing && editing.file === c.file ? 'true' : 'false', onclick: () => openCase(c.file).catch(fail) },
    '[' + c.id + '] ' + c.title, el('small', {}, c.error || (c.steps + ' step(s)' + (c.module ? ' · ' + c.module : '')))));
}
async function openCase(file) {
  editing = { file, tc: await api('/api/testcases?dir=' + encodeURIComponent(caseDir()) + '&file=' + encodeURIComponent(file)) };
  renderCaseList(); renderCaseEditor();
}
function stepRow(step) {
  const a = el('textarea', { rows: '2', placeholder: 'Action, e.g. Open Accounts payable > Vendors > All vendors', 'data-sa': '1' }); a.value = step.action || '';
  const x = el('textarea', { rows: '2', placeholder: 'Expected result (optional)', 'data-se': '1' }); x.value = step.expected || '';
  const row = el('div', { class: 'step' }, el('span', { class: 'num' }), a, x, el('div', { class: 'row' },
    el('button', { class: 'btn', type: 'button', 'aria-label': 'Move up', onclick: () => { if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling); renumber(); } }, '↑'),
    el('button', { class: 'btn danger', type: 'button', 'aria-label': 'Remove step', onclick: () => { row.remove(); renumber(); } }, '×')));
  return row;
}
function renumber() { document.querySelectorAll('#steps .step .num').forEach((n, i) => { n.textContent = (i + 1) + '.'; }); }
function input(id, label, value, opts = {}) {
  const i = el(opts.area ? 'textarea' : 'input', { id, type: 'text', placeholder: opts.placeholder || '', autocomplete: 'off' }); i.value = value == null ? '' : value;
  return el('div', { class: 'field' }, el('label', { for: id }, label), i, opts.help ? el('div', { class: 'help' }, opts.help) : null);
}
function renderCaseEditor() {
  const ed = $('caseEditor'); ed.replaceChildren();
  if (!editing) { ed.append(el('p', { class: 'empty' }, 'Pick a test case to edit, or create a new one. Steps are plain language: the agent reads them and drives F&O.')); return; }
  const tc = editing.tc;
  ed.append(el('div', { class: 'actions' }, el('h3', {}, editing.file ? tc.title : 'New test case'),
    editing.file ? el('button', { class: 'btn', type: 'button', onclick: () => runCase(tc.id) }, 'Run this case') : null,
    editing.file ? el('button', { class: 'btn', type: 'button', onclick: () => { editing = { file: null, tc: { ...tc, id: tc.id + '-COPY', title: tc.title + ' (copy)' } }; renderCaseList(); renderCaseEditor(); } }, 'Duplicate') : null,
    editing.file ? el('button', { class: 'btn danger', type: 'button', onclick: () => deleteCase().catch(fail) }, 'Delete') : null));
  const form = el('form', { id: 'caseForm' },
    input('tcId', 'Id', tc.id, { placeholder: 'TC-VENDOR-001', help: editing.file ? 'Saved in ' + editing.file : 'Leave empty to derive it from the title.' }),
    input('tcTitle', 'Title', tc.title),
    input('tcModule', 'Module', tc.module, { placeholder: 'Accounts payable' }),
    input('tcEntity', 'Legal entity', tc.legalEntity, { placeholder: 'Default from the profile', help: 'Navigation to another company is refused during the run.' }),
    input('tcPriority', 'Priority (1-4)', tc.priority),
    input('tcTags', 'Tags', (tc.tags || []).join(', '), { placeholder: 'smoke, vendor' }),
    input('tcPre', 'Preconditions', tc.preconditions, { area: true }),
    el('fieldset', {}, el('legend', {}, 'Steps'), el('div', { class: 'steps', id: 'steps' }, (tc.steps || []).map(stepRow)),
      el('button', { class: 'btn', type: 'button', onclick: () => { $('steps').append(stepRow({})); renumber(); } }, '+ Add step')),
    el('div', { class: 'err', id: 'caseErr', role: 'alert' }),
    el('div', { class: 'actions' }, el('button', { class: 'btn primary', type: 'submit' }, 'Save test case')));
  form.addEventListener('submit', (ev) => { ev.preventDefault(); saveCase().catch((e) => { $('caseErr').textContent = e.message; }); });
  ed.append(form); renumber();
}
async function saveCase() {
  const steps = [...document.querySelectorAll('#steps .step')].map((r) => ({ action: r.querySelector('[data-sa]').value, expected: r.querySelector('[data-se]').value })).filter((s) => s.action.trim() || s.expected.trim());
  const testCase = { id: $('tcId').value.trim(), title: $('tcTitle').value, module: $('tcModule').value, legalEntity: $('tcEntity').value, priority: $('tcPriority').value.trim(),
    tags: $('tcTags').value.split(',').map((t) => t.trim()).filter(Boolean), preconditions: $('tcPre').value, steps };
  const q = '?dir=' + encodeURIComponent(caseDir()) + (editing.file ? '&file=' + encodeURIComponent(editing.file) : '');
  const res = await api('/api/testcases' + q, 'PUT', { testCase });
  toast('Saved'); editing = null; await loadCases(res.file);
}
async function deleteCase() {
  if (!confirm('Delete the test case "' + editing.tc.title + '" (' + editing.file + ')?')) return;
  await api('/api/testcases?dir=' + encodeURIComponent(caseDir()) + '&file=' + encodeURIComponent(editing.file), 'DELETE');
  toast('Deleted'); editing = null; await loadCases();
}
function runCase(id) {
  document.querySelector('input[name=source][value=local]').checked = true;
  $('local').value = caseDir();
  const sel = $('caseId'); sel.replaceChildren(el('option', { value: id }, id)); sel.value = id;
  showTab('run');
}
$('caseDirLoad').addEventListener('click', () => { editing = null; loadCases().catch(fail); });
$('caseNew').addEventListener('click', () => { editing = { file: null, tc: { id: '', title: '', steps: [{ action: 'Sign in to D365 F&O and open the default dashboard', expected: 'The dashboard is shown' }], tags: [] } }; renderCaseList(); renderCaseEditor(); });

refresh().catch(fail);
initRun();
</script>
</body>
</html>
