# Builds the installer from app/ (written by scripts/stage.mjs).
appId: com.d365fo.agent
productName: D365FO Agent
directories:
  app: app
  output: release
  buildResources: build
# Child processes run the app's own scripts with the bundled Electron as Node; keep them as plain files.
asar: false
# No auto-update feed yet.
publish: null
# No Python, uv or other first-launch runtime downloads are required.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage]
  category: Development
