<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Navigation</title>
    <style>
      :root {
        --bg: #f1f2f4;
        --fg: #4b5563;
        --hover: #e3e5e9;
        --on: #1f2937;
        --on-bg: #fff;
        --accent: #2563eb;
        --line: #d9dce1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181b;
          --fg: #a1a6b0;
          --hover: #24262b;
          --on: #f3f4f6;
          --on-bg: #2d3037;
          --accent: #60a5fa;
          --line: #2a2c31;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          11px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0;
        gap: 2px;
        border-right: 1px solid var(--line);
      }
      button {
        all: unset;
        box-sizing: border-box;
        width: 60px;
        padding: 8px 0 6px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background: var(--hover);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
      }
      button[aria-current='page'] {
        background: var(--on-bg);
        color: var(--on);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      button[aria-current='page'] svg {
        color: var(--accent);
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .spacer {
        flex: 1;
      }
      #profile {
        border-top: 1px solid var(--line);
        border-radius: 0;
        padding-top: 10px;
        width: 68px;
      }
      #profile .badge {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 600;
      }
      #profile .badge.none {
        background: var(--hover);
        color: var(--fg);
      }
      #profile .name {
        max-width: 62px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
      }
      #profile .busy {
        font-size: 9px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <button data-id="chat" title="Chat (Ctrl/Cmd+1)">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" /></svg>Chat
    </button>
    <button data-id="cases" title="Tests (Ctrl/Cmd+2)">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11" /></svg>Tests
    </button>
    <button data-id="results" title="Results (Ctrl/Cmd+3)">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7" /></svg>Results
    </button>
    <button data-id="settings" title="Settings (Ctrl/Cmd+4)">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg
      >Settings
    </button>
    <div class="spacer"></div>
    <button id="profile" title="Switch profile">
      <span class="badge none" id="badge">?</span><span class="name" id="pname">No profile</span
      ><span class="busy" id="busy" hidden>run in progress</span>
    </button>
    <script>
      for (const b of document.querySelectorAll('button[data-id]'))
        b.addEventListener('click', () => rail.go(b.dataset.id));
      document.getElementById('profile').addEventListener('click', () => rail.profileMenu());
      rail.onState(({ current, profile, busy }) => {
        for (const b of document.querySelectorAll('button[data-id]')) {
          if (b.dataset.id === current) b.setAttribute('aria-current', 'page');
          else b.removeAttribute('aria-current');
        }
        const badge = document.getElementById('badge');
        badge.textContent = profile ? profile.trim().charAt(0).toUpperCase() : '?';
        badge.classList.toggle('none', !profile);
        document.getElementById('pname').textContent = profile || 'No profile';
        document.getElementById('profile').title = profile
          ? 'Profile in use: ' + profile + '. Click to switch.'
          : 'Choose a profile';
        document.getElementById('busy').hidden = !busy;
      });
    </script>
  </body>
</html>
