<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>D365FO Agent</title>
<style>
  :root { --bg:#f5f6f8; --text:#1b1f27; --muted:#5d6878; --line:#d9dde4; --accent:#1f5fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#11141a; --text:#e7eaf0; --muted:#9aa5b5; --line:#2f3644; --accent:#6b9cf5; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:min(640px,90vw); text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 .4rem; }
  #status { color:var(--muted); margin:0 0 1rem; }
  .spin { display:inline-block; width:1.4rem; height:1.4rem; border:3px solid var(--accent); border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  pre { text-align:left; height:9rem; overflow:hidden; margin:0; padding:.6rem .8rem; border:1px solid var(--line); border-radius:8px; color:var(--muted); font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<main>
  <div class="spin" aria-hidden="true"></div>
  <h1>D365FO Agent</h1>
  <p id="status" role="status">Starting…</p>
  <pre id="log" aria-label="Details"></pre>
</main>
<script>
  const lines = [];
  window.setStatus = (text, line) => {
    if (text) document.getElementById('status').textContent = text;
    if (line) { lines.push(line); if (lines.length > 9) lines.shift(); document.getElementById('log').textContent = lines.join('\n'); }
  };
</script>
</body>
</html>
