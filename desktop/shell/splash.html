<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>D365FO Agent</title>
<style>
  :root { --bg:#f8fafc; --panel:#fff; --text:#17212f; --muted:#64748b; --line:#dbe1e8; --accent:#2563eb; --good:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181b; --panel:#202226; --text:#eceef3; --muted:#a0a7b4; --line:#383c43; --accent:#7eabff; --good:#87d9a0; --bad:#ff9696; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:min(560px,90vw); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 30px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  #status { color:var(--muted); margin:0 0 18px; }
  ol { list-style:none; margin:0 0 18px; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:6px 0; color:var(--muted); }
  li .dot { width:18px; height:18px; flex:none; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:11px; }
  li.active { color:var(--text); font-weight:500; }
  li.active .dot { border-color:var(--accent); border-right-color:transparent; animation:spin .8s linear infinite; }
  li.done { color:var(--text); }
  li.done .dot { border-color:var(--good); background:var(--good); color:var(--panel); }
  li.done .dot::after { content:'✓'; }
  li.failed .dot { border-color:var(--bad); background:var(--bad); color:var(--panel); }
  li.failed .dot::after { content:'!'; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hint { background:color-mix(in srgb, var(--accent) 8%, transparent); border-radius:10px; padding:10px 12px; margin:0 0 14px; font-size:14px; }
  button { all:unset; color:var(--accent); cursor:pointer; font-weight:500; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  pre { text-align:left; max-height:9rem; overflow:auto; margin:8px 0 0; padding:.6rem .8rem; border:1px solid var(--line); border-radius:8px; color:var(--muted); font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<main>
  <h1>Getting the chat ready</h1>
  <p id="status" role="status">Starting…</p>
  <ol id="steps">
    <li data-step="app"><span class="dot"></span>Start the test app</li>
    <li data-step="install"><span class="dot"></span>Install chat components (first start only)</li>
    <li data-step="start"><span class="dot"></span>Start the chat</li>
    <li data-step="connect"><span class="dot"></span>Connect the chat to your tests</li>
  </ol>
  <p class="hint">Tests, Results and Settings work already. <button id="openTests" type="button">Open Tests</button> · <button id="openSettings" type="button">Open Settings</button></p>
  <details><summary>Details</summary><pre id="log" aria-label="Details"></pre></details>
</main>
<script>
  const lines = [];
  const order = ['app', 'install', 'start', 'connect'];
  /** Marks `step` as running, the steps before it as done; 'ready' finishes all, 'failed' marks the running one. */
  window.setStep = (step) => {
    const items = [...document.querySelectorAll('[data-step]')];
    if (step === 'failed') {
      for (const li of items) if (li.classList.contains('active')) li.className = 'failed';
      return;
    }
    const at = step === 'ready' ? order.length : order.indexOf(step);
    items.forEach((li, i) => (li.className = i < at ? 'done' : i === at ? 'active' : ''));
  };
  window.setStatus = (text, line) => {
    if (text) document.getElementById('status').textContent = text;
    if (line) {
      lines.push(line);
      if (lines.length > 60) lines.shift();
      const log = document.getElementById('log');
      log.textContent = lines.join('\n');
      log.scrollTop = log.scrollHeight;
    }
  };
  for (const [id, target] of [['openTests', 'cases'], ['openSettings', 'settings']])
    document.getElementById(id).addEventListener('click', () => window.rail?.go(target));
  setStep('app');
</script>
</body>
</html>
